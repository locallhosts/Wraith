name: Platform CI

on:
  push:
    branches: [main]
    paths:
      - "backend-go/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "backend-go/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".github/workflows/platform-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test Go control plane
        working-directory: backend-go
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080
        run: npm run build
