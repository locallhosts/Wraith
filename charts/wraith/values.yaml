replicaCount: 2

image:
  repository: ghcr.io/yourname/wraith-backend
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

config:
  rulesDir: /app/rules
  metricsEnabled: true
  rateLimitRPM: 120

# Secrets are intentionally NOT set here — pass via --set-file, an
# External Secrets Operator, or a separately-managed Secret resource.
# See docs/ENTERPRISE.md "Secrets & key management".
secretName: wraith-secrets

persistence:
  pipelineOutput:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteMany
