services:
  backend:
    ports: []

  frontend:
    ports: []

  caddy:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      - WRAITH_DOMAIN=${WRAITH_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:

# The public deployment only publishes Caddy. Internal services stay on the Compose network.
