openapi: 3.0.3
info:
  title: WRAITH API
  version: "1.0"
  description: >
    Predictive detection engineering platform API. All routes except
    /healthz, /readyz, /metrics, and /webhook/github require a Bearer API
    key; role requirements are noted per route.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API key issued via `wraith apikey create`"
  schemas:
    RunStatus:
      type: object
      properties:
        run_id: { type: string }
        rule_path: { type: string }
        rule_id: { type: string }
        rule_title: { type: string }
        repo: { type: string }
        pr_number: { type: integer }
        stage:
          type: string
          enum: [lint, provision, simulate, validate, soar, done, failed]
        passed: { type: boolean, nullable: true }
        reason: { type: string }
        approved_by: { type: string }
        approved_at: { type: string, format: date-time, nullable: true }
        deployed_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PipelineJob:
      type: object
      properties:
        id: { type: integer }
        run_id: { type: string }
        rule_path: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        available_at: { type: string, format: date-time }
        locked_by: { type: string }
        locked_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        actor: { type: string }
        actor_role: { type: string }
        action: { type: string }
        resource: { type: string }
        detail: { type: string }
        ip_address: { type: string }
        timestamp: { type: string, format: date-time }
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses: { "200": { description: OK } }
  /readyz:
    get:
      summary: Readiness probe (checks store connectivity)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses: { "200": { description: OK } }
  /webhook/github:
    post:
      summary: GitHub pull_request webhook receiver (HMAC-verified, not API-key auth)
      security: []
      responses:
        "200": { description: Accepted, pipeline runs triggered for changed rules }
        "401": { description: Invalid signature }
  /runs:
    get:
      summary: List recent pipeline runs
      description: Requires role >= viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunStatus" }
  /runs/{id}:
    get:
      summary: Get one run's status
      description: Requires role >= viewer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStatus" }
        "404": { description: Not found }
  /runs/{id}/approve:
    post:
      summary: Human-in-the-loop approval of a passing run
      description: Requires role >= lead. Precondition for /deploy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Approved }
        "409": { description: Run has not passed and cannot be approved }
  /runs/{id}/deploy:
    post:
      summary: Promote an approved, attested run to the production SIEM
      description: >
        Requires role >= lead, a prior approval, and a valid ed25519
        provenance attestation matching the rule's CURRENT content.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deployed }
        "403": { description: Attestation invalid, untrusted, or rule content has drifted since testing }
        "409": { description: Run has not been approved }
        "503": { description: Signing/trust key not configured on this server }
  /lint:
    post:
      summary: Manually lint all rules in the configured rules directory
      description: Requires role >= analyst
      responses: { "200": { description: OK } }
  /session:
    get:
      summary: Current authenticated dashboard identity
      description: Requires role >= viewer
      responses:
        "200": { description: Authenticated identity }
  /runs/{id}/events:
    get:
      summary: Pipeline execution events for a run
      description: Requires role >= viewer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, maximum: 2000 }
      responses:
        "200": { description: Event list }
  /runs/{id}/report:
    get:
      summary: Pipeline evidence report
      description: Requires role >= viewer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Pipeline report }
        "404": { description: Report not available yet }
  /runs/{id}/attestation:
    get:
      summary: Signed provenance attestation
      description: Requires role >= viewer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Attestation }
        "404": { description: Attestation not available }
  /rules:
    get:
      summary: List configured Sigma rules and lint summaries
      description: Requires role >= viewer
      responses:
        "200": { description: Rule summaries }
  /rules/{name}:
    get:
      summary: Inspect one Sigma rule and its lint findings
      description: Requires role >= viewer
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Rule source and lint findings }
        "404": { description: Rule not found }
  /jobs:
    get:
      summary: List durable pipeline jobs
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Pipeline jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineJob" }
  /jobs/{id}/retry:
    post:
      summary: Retry a failed or cancelled pipeline job
      security: [{ApiKeyAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: Job requeued}
        "409": {description: Job is not retryable}
  /runs/{id}/cancel:
    post:
      summary: Cancel a queued or running pipeline job
      security: [{ApiKeyAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Run cancelled}
        "409": {description: Run is terminal}
  /audit:
    get:
      summary: Full audit trail
      description: Requires role >= admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
