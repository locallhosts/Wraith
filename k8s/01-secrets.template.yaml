apiVersion: v1
kind: Secret
metadata:
  name: wraith-secrets
  namespace: wraith
type: Opaque
stringData:
  WRAITH_DATABASE_URL: "postgres://wraith:CHANGE-ME@wraith-postgres:5432/wraith?sslmode=require"
  WRAITH_WEBHOOK_SECRET: "CHANGE-ME"
  WRAITH_SIGNING_PUBLIC_KEY: "CHANGE-ME-base64-ed25519-public-key"
  WRAITH_SLACK_WEBHOOK_URL: "CHANGE-ME"
  ANTHROPIC_API_KEY: "CHANGE-ME"
